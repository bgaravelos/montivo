services:
  montivo:
    build: .
    image: montivo
    ports:
      - "127.0.0.1:8765:8765"   # this machine only: a server with your key and no password
    volumes:
      - ./data:/data          # runs/ and footage/ (put your clips in ./data/footage)
    env_file:
      - path: .env            # MODEL_API_KEY, BASETEN_API_KEY (see .env.example); optional
        required: false
