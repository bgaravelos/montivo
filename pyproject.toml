[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "montivo"
version = "0.1.0"
description = "Montivo: an agent-first video editor. Muse Spark plans and reviews, Muse Voice keeps time, SAM 3.1 runs the camera, ffmpeg renders."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28",
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
montivo = "montivo.cli:main"

[tool.setuptools.packages.find]
include = ["montivo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
