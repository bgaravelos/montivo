[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "montivo"
version = "0.1.0"
description = "Montivo: an agent-first video editor. Muse Spark plans and reviews, Muse Voice keeps time, SAM 3.1 runs the camera, ffmpeg renders."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28",
    "pillow>=10.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
host = ["modal>=1.6"]  # modal_app.py: the hosted demo for the judges

[project.scripts]
montivo = "montivo.cli:main"
montivo-ui = "montivo.server.app:main"

[tool.setuptools.packages.find]
include = ["montivo*"]

[tool.setuptools.package-data]
"montivo.server" = ["static/**/*"]
"montivo" = ["fonts/*", "fonts/licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests import shared helpers as tests.<module>
